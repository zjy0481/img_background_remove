<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片背景去除工具</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="banner">
    <nav class="banner-nav">
      <button class="banner-btn active" type="button" data-page="batch">批量模式</button>
      <button class="banner-btn" type="button" data-page="refine">精修模式</button>
    </nav>
    <div class="banner-model">
      <label for="model-select">抠图模型</label>
      <select id="model-select" title="切换抠图模型（开发文档 5.5）"></select>
    </div>
  </header>

  <main>
    <section id="page-batch" class="page active">
      <div class="panel">
        <h2>文件列表（source_img）</h2>
        <div class="panel-toolbar">
          <button type="button" id="btn-refresh">刷新</button>
          <button type="button" id="btn-select-all">全选</button>
          <button type="button" id="btn-select-none">全不选</button>
        </div>
        <p class="placeholder">M1 实现：缩略图 + 文件名列表（默认全选）</p>
      </div>
      <div class="panel">
        <h2>处理结果列表</h2>
        <p class="placeholder">M1 实现：文件名 + 缩略图 + 状态，点击查看大图（含“返回列表”按钮）</p>
      </div>
    </section>

    <section id="page-refine" class="page">
      <div class="panel">
        <h2>成品列表（processed_img）</h2>
        <p class="placeholder">M2 实现：缩略图 + 文件名，选择后进行精修</p>
      </div>
      <div class="slots">
        <div class="panel">
          <h2>图槽 1：原图 + 涂鸦</h2>
          <p class="placeholder">M2 实现：画布（缩放 / 拖动同步 / 涂鸦 / 撤销 / 橡皮 / 显隐 / 轮次颜色）</p>
        </div>
        <div class="panel">
          <h2>图槽 2：结果</h2>
          <div class="tabbar">
            <button type="button" class="tab active">精修前</button>
            <button type="button" class="tab">精修后</button>
          </div>
          <p class="placeholder">M2 实现：标签页式切换对比</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar" id="statusbar">正在连接服务…</footer>
  <script src="/js/app.js"></script>
</body>
</html>
